<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arquitectura de Alnitak</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafaf7; color: #101828; font-family: Montserrat, sans-serif; }
    svg { display: block; width: 100%; min-width: 840px; }
    .node { fill: #fff; stroke: #101828; stroke-width: 1; }
    .store { fill: rgba(16, 24, 40, .05); stroke: #4a5565; stroke-width: 1; }
    .input { fill: rgba(74, 85, 101, .10); stroke: #6a7282; stroke-width: 1; }
    .focal { fill: rgba(0, 102, 255, .08); stroke: #0066ff; stroke-width: 1.2; }
    .zone { fill: rgba(16, 24, 40, .02); stroke: rgba(16, 24, 40, .18); stroke-width: .8; stroke-dasharray: 4 4; }
    .tag { font: 500 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; fill: #4a5565; }
    .name { font: 600 14px Montserrat, sans-serif; fill: #101828; }
    .detail { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4a5565; }
    .edge { fill: none; stroke: #4a5565; stroke-width: 1.2; marker-end: url(#arrow); }
    .link { fill: none; stroke: #0066ff; stroke-width: 1.2; marker-end: url(#arrow-link); }
    .label { font: 500 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; fill: #4a5565; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 560" role="img" aria-labelledby="alnitak-architecture-title alnitak-architecture-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="alnitak-architecture-title">Arquitectura de identificación facial Alnitak</title>
    <desc id="alnitak-architecture-desc">Canales y consola llegan a la API orquestadora, que vectoriza la imagen y consulta la galería; el recorte y la auditoría se conservan en almacenes separados.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4a5565"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0066ff"/></marker>
    </defs>
    <rect width="960" height="560" fill="#fafaf7"/>
    <rect class="zone" x="264" y="152" width="656" height="272" rx="8"/>
    <rect x="280" y="156" width="188" height="20" rx="4" fill="#fafaf7"/>
    <text class="tag" x="292" y="170">SERVICIO PRIVADO</text>

    <path class="link" d="M200 240 H280"/>
    <path class="edge" d="M440 240 H520"/>
    <path class="edge" d="M680 240 H760"/>
    <path class="edge" d="M120 360 H352 Q360 360 360 352 V280"/>
    <path class="edge" d="M344 280 V312 Q344 320 352 320 H592 Q600 320 600 328 V360"/>
    <path class="edge" d="M376 280 V336 Q376 344 384 344 H832 Q840 344 840 352 V360"/>

    <rect x="220" y="212" width="48" height="16" rx="4" fill="#fafaf7"/>
    <text class="label" x="244" y="224" text-anchor="middle">IMAGEN</text>
    <rect x="464" y="212" width="64" height="16" rx="4" fill="#fafaf7"/>
    <text class="label" x="496" y="224" text-anchor="middle">PROCESA</text>
    <rect x="696" y="212" width="48" height="16" rx="4" fill="#fafaf7"/>
    <text class="label" x="720" y="224" text-anchor="middle">512-D</text>
    <rect x="500" y="300" width="48" height="16" rx="4" fill="#fafaf7"/>
    <text class="label" x="524" y="312" text-anchor="middle">RECORTE</text>
    <rect x="628" y="324" width="48" height="16" rx="4" fill="#fafaf7"/>
    <text class="label" x="652" y="336" text-anchor="middle">EVENTO</text>

    <rect class="input" x="40" y="200" width="160" height="80" rx="6"/>
    <text class="tag" x="56" y="220">ENTRADA</text>
    <text class="name" x="120" y="246" text-anchor="middle">Canales cliente</text>
    <text class="detail" x="120" y="264" text-anchor="middle">consulta 1:N</text>

    <rect class="input" x="40" y="320" width="160" height="80" rx="6"/>
    <text class="tag" x="56" y="340">OPERACIÓN</text>
    <text class="name" x="120" y="366" text-anchor="middle">Consola</text>
    <text class="detail" x="120" y="384" text-anchor="middle">sesión corporativa</text>

    <rect class="focal" x="280" y="200" width="160" height="80" rx="6"/>
    <text class="tag" x="296" y="220">ORQUESTACIÓN</text>
    <text class="name" x="360" y="246" text-anchor="middle">API Alnitak</text>
    <text class="detail" x="360" y="264" text-anchor="middle">validación · score</text>

    <rect class="node" x="520" y="200" width="160" height="80" rx="6"/>
    <text class="tag" x="536" y="220">GPU</text>
    <text class="name" x="600" y="246" text-anchor="middle">Vectorización</text>
    <text class="detail" x="600" y="264" text-anchor="middle">detección · alineación</text>

    <rect class="store" x="760" y="200" width="160" height="80" rx="6"/>
    <text class="tag" x="776" y="220">GALERÍA</text>
    <text class="name" x="840" y="246" text-anchor="middle">Índice vectorial</text>
    <text class="detail" x="840" y="264" text-anchor="middle">kNN · Top-N</text>

    <rect class="store" x="520" y="360" width="160" height="80" rx="6"/>
    <text class="tag" x="536" y="380">CUSTODIA</text>
    <text class="name" x="600" y="406" text-anchor="middle">Recortes cifrados</text>
    <text class="detail" x="600" y="424" text-anchor="middle">almacén de objetos</text>

    <rect class="store" x="760" y="360" width="160" height="80" rx="6"/>
    <text class="tag" x="776" y="380">TRAZABILIDAD</text>
    <text class="name" x="840" y="406" text-anchor="middle">Auditoría</text>
    <text class="detail" x="840" y="424" text-anchor="middle">huella · actor · tiempo</text>

    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(16,24,40,.12)" stroke-width="1"/>
    <text class="tag" x="40" y="512">LEYENDA</text>
    <rect x="136" y="500" width="12" height="12" rx="2" fill="rgba(0,102,255,.08)" stroke="#0066ff"/>
    <text class="detail" x="160" y="510">punto de orquestación</text>
    <rect x="336" y="500" width="12" height="12" rx="2" fill="rgba(16,24,40,.05)" stroke="#4a5565"/>
    <text class="detail" x="360" y="510">almacenamiento</text>
    <line x1="520" y1="506" x2="544" y2="506" stroke="#0066ff" stroke-width="1.2"/>
    <text class="detail" x="556" y="510">flujo principal</text>
  </svg>
</body>
</html>
